title: Best Practice Submission
icon: inbox

buttons:
  - preview
  - "-"
  - convertBestPracticeSubmission
  - settings
  - status

status:
  draft: Pending review
  unlisted: In review

tabs:
  submission:
    label: Submission
    icon: text
    columns:
      - width: 1/3
        fields:
          title:
            type: text
            label: Project title
            required: true

          location:
            type: text
            label: Location

          year:
            type: number
            label: Year

          area:
            type: number
            label: Building area
            step: 0.01
            help: Area in square meters.

          function:
            type: text
            label: Function

          constructionType:
            type: text
            label: Construction type

          co2Range:
            type: select
            label: CO₂ range
            empty: Not provided
            options:
              below-10: "Below 10 kgCO₂/m²/year"
              10-20: "10–20 kgCO₂/m²/year"
              20-30: "20–30 kgCO₂/m²/year"
              above-30: "Above 30 kgCO₂/m²/year"

          co2Value:
            type: number
            label: CO₂ value
            step: 0.1

      - width: 2/3
        fields:
          description:
            type: textarea
            label: Project description
            buttons: false
            size: large

          sourceUrl:
            type: url
            label: Project or source URL

          submitterName:
            type: text
            label: Submitted by
            readonly: true

          submitterEmail:
            type: email
            label: Submitter email
            readonly: true

          submittedAt:
            type: text
            label: Submitted at
            readonly: true

  files:
    label: Files
    icon: image
    sections:
      images:
        type: files
        label: Submission files
        layout: cards
