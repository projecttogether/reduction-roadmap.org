title: Best Practice Submission
icon: inbox

buttons:
  - preview
  - "-"
  - settings
  - status

status:
  draft: Pending review
  unlisted: In review

tabs:
  submission:
    label: Submission
    icon: text
    columns:
      - width: 1/3
        fields:
          title:
            type: text
            label: Projekttitel
            required: true

          projectSponsor:
            type: text
            label: Projektträger:in oder Auftraggeber:in

          participatingOrganizations:
            type: textarea
            label: Beteiligte Organisationen

          projectStatus:
            type: select
            label: Projektstatus
            options:
              planning: In Planung
              under-construction: Im Bau
              completed: Fertiggestellt

          projectPeriod:
            type: text
            label: Projektzeitraum

          location:
            type: text
            label: Projektstandort

          buildingUse:
            type: select
            label: Gebäudenutzung
            options:
              residential: Wohngebäude
              non-residential: Nichtwohngebäude
              neighborhood: Quartier oder Siedlung
              mixed: Gemischte Nutzung
              other: Andere Nutzung

          grossFloorArea:
            type: number
            label: Brutto-Grundfläche (BGF) in m²
            step: 0.01

          constructionType:
            type: select
            label: Baumaßnahme
            options:
              new-build: Neubau
              existing-building: Bauen im Bestand
              combined: Kombination mehrerer Maßnahmen
              other: Andere Maßnahme

          thgTarget:
            type: select
            label: THG-Zielwert in der Planung
            options:
              below-10: Unter 10
              10-20: 10 bis unter 20
              20-30: 20 bis unter 30
              30-plus: 30 oder mehr
              none: Kein Zielwert festgelegt
              unknown: Unbekannt

          thgValue:
            type: text
            label: THG-Kennwert bei Projektabschluss

          areaReference:
            type: select
            label: Flächenbezug der THG-Werte
            options:
              gross-floor-area: Brutto-Grundfläche (BGF)
              net-room-area: Nettoraumfläche (NRF)
              living-area: Wohnfläche (WoFl)
              usable-area: Nutzfläche (NUF)
              other: Andere
              unknown: Nicht bekannt

          sourceUrl:
            type: url
            label: Projektwebseite oder andere Quelle

          description:
            type: textarea
            label: Projektbeschreibung
            buttons: false
            size: large

      - width: 2/3
        fields:
          submitterName:
            type: text
            label: Name
            readonly: true

          submitterRole:
            type: text
            label: Funktion oder Bezug zum Projekt

          submitterOrganization:
            type: text
            label: Organisation oder Institution

          submitterEmail:
            type: email
            label: E-Mail-Adresse
            readonly: true

          submitterPhone:
            type: tel
            label: Telefonnummer

          submitPermission:
            type: text
            label: Übermittlung bestätigt
            readonly: true

          imageRights:
            type: text
            label: Bildrechte bestätigt
            readonly: true

          contactPermission:
            type: text
            label: Kontaktaufnahme erlaubt
            readonly: true

          internalNotes:
            type: textarea
            label: Interne Hinweise und Ergänzungen
            buttons: false

          submittedAt:
            type: text
            label: Eingereicht am
            readonly: true

  files:
    label: Dateien
    icon: image
    sections:
      images:
        type: files
        label: Darstellungen oder Bilder vom Projekt
        layout: cards
