title: Roadmap
icon: chart

tabs:
  content:
    label: Content
    icon: text
    sections:
      content:
        type: fields
        fields:
          title:
            type: text
            label: Page Title
          version:
            type: select
            label: Version
            default: "2.0"
            options:
              "1.0": "Reduction Roadmap 1.0"
              "2.0": "Reduction Roadmap 2.0"
          headline:
            type: text
            label: Hero Headline
          heroImage:
            type: files
            label: Hero Image
            max: 1
          layout:
            type: layout
            label: Page Layout
            layouts:
              - "1/1"
              - "1/2, 1/2"
            fieldsets:
              - heading
              - text
              - image
              - quote
              - list
              - hero
              - announcement
              - image-full
              - download-cta
              - social-section
              - org-info

  files:
    label: Files
    icon: image
    sections:
      files:
        type: files
        headline: Images & Downloads
