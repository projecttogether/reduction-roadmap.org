title: Praxisbeispiel
icon: building

status:
  draft: Entwurf
  listed: Veröffentlicht

tabs:
  content:
    label: Inhalt
    icon: text
    columns:
      - width: 1/2
        sections:
          public:
            type: fields
            fields:
              publicInfo:
                type: info
                label: Öffentliche Projektdaten
                text: Diese Felder werden auf der Website angezeigt (Projektkarte und Projektseite).
              title:
                type: text
                label: Projekttitel
                required: true

              location:
                type: text
                label: Projektstandort

              projectPeriod:
                type: text
                label: Jahr / Zeitraum
                help: "Beispiel: 2018 oder 2019–2024"

              grossFloorArea:
                type: text
                label: Brutto-Grundfläche (m²)

              buildingUse:
                type: select
                label: Gebäudenutzung
                options:
                  residential: Wohngebäude
                  non-residential: Nichtwohngebäude
                  neighborhood: Quartier oder Siedlung
                  mixed: Gemischte Nutzung
                  other: Andere Nutzung

              constructionType:
                type: select
                label: Baumaßnahme
                options:
                  new-build: Neubau
                  existing-building: Bauen im Bestand
                  combined: Kombination mehrerer Maßnahmen
                  other: Andere Maßnahme

              thgTarget:
                type: select
                label: CO₂-Bereich (THG-Zielwert, kgCO₂e/m²a)
                options:
                  below-10: Unter 10
                  10-20: 10 bis unter 20
                  20-30: 20 bis unter 30
                  30-plus: 30 oder mehr
                  none: Kein Zielwert festgelegt
                  unknown: Unbekannt

              thgValue:
                type: text
                label: CO₂-Kennwert bei Fertigstellung (kgCO₂e/m²a)

              sourceUrl:
                type: url
                label: Externer Link oder Quelle
                help: Optional. Leer lassen, um auf diese Projektseite zu verlinken.

              description:
                type: textarea
                label: Projektbeschreibung
                buttons: false
                size: large

      - width: 1/2
        sections:
          media:
            type: fields
            fields:
              cover:
                type: files
                label: Titelbild
                max: 1
                query: page.images

          images:
            type: files
            label: Bilder & Uploads
            layout: cards
            empty: Noch keine Bilder

          submission:
            type: fields
            fields:
              submissionInfo:
                type: info
                label: Angaben aus der Einreichung
                text: Zusätzliche Informationen aus der Einreichung. Nicht öffentlich sichtbar.
              projectSponsor:
                type: text
                label: Projektträger:in oder Auftraggeber:in
              participatingOrganizations:
                type: textarea
                label: Beteiligte Organisationen
                buttons: false
              projectStatus:
                type: select
                label: Projektstatus
                options:
                  planning: In Planung
                  under-construction: Im Bau
                  completed: Fertiggestellt
              areaReference:
                type: select
                label: Flächenbezug der THG-Werte
                options:
                  gross-floor-area: Brutto-Grundfläche (BGF)
                  net-room-area: Nettoraumfläche (NRF)
                  living-area: Wohnfläche (WoFl)
                  usable-area: Nutzfläche (NUF)
                  other: Andere
                  unknown: Nicht bekannt

          contact:
            type: fields
            fields:
              contactInfo:
                type: info
                label: Kontakt & interne Notizen
                text: Nur für Rückfragen und interne Bearbeitung. Nicht öffentlich sichtbar.
              submitterName:
                type: text
                label: Name
              submitterRole:
                type: text
                label: Funktion oder Bezug zum Projekt
              submitterOrganization:
                type: text
                label: Organisation
              submitterEmail:
                type: email
                label: E-Mail-Adresse
              submitterPhone:
                type: tel
                label: Telefonnummer
              contactPermission:
                type: select
                label: Kontaktaufnahme erlaubt
                options:
                  "yes": Ja
                  "no": Nein
              submitPermission:
                type: select
                label: Übermittlung der Angaben bestätigt
                options:
                  "yes": Ja
              imageRights:
                type: select
                label: Bildrechte bestätigt
                options:
                  "yes": Ja
              internalNotes:
                type: textarea
                label: Interne Hinweise
                buttons: false
              submittedAt:
                type: text
                label: Eingereicht am
                disabled: true
