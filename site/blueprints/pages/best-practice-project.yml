title: Best Practice Project
icon: building

status:
  draft: Draft
  listed: Published

tabs:
  content:
    label: Content
    icon: text
    columns:
      - width: 1/3
        fields:
          title:
            type: text
            label: Project title
            required: true

          location:
            type: text
            label: Location

          year:
            type: number
            label: Year
            min: 1900
            max: 2100

          area:
            type: number
            label: Building area
            help: Area in square meters.
            min: 0
            step: 0.01

          function:
            type: text
            label: Function
            help: "Example: Residential, Education, Office"

          constructionType:
            type: text
            label: Construction type
            help: "Example: New build, renovation, conversion"

          co2Range:
            type: select
            label: CO₂ range
            empty: Select a range
            options:
              below-10: "Below 10 kgCO₂/m²/year"
              10-20: "10–20 kgCO₂/m²/year"
              20-30: "20–30 kgCO₂/m²/year"
              above-30: "Above 30 kgCO₂/m²/year"

          co2Value:
            type: number
            label: CO₂ value
            help: Optional exact value in kgCO₂/m²/year.
            step: 0.1

          detailLink:
            type: url
            label: External detail link
            help: Optional. Leave empty to link to this project page.

      - width: 2/3
        fields:
          cover:
            type: files
            label: Cover image
            max: 1
            query: page.images

          description:
            type: textarea
            label: Project description
            buttons: false
            size: large

  files:
    label: Project files
    icon: image
    sections:
      images:
        type: files
        label: Images
        layout: cards
        template: image
