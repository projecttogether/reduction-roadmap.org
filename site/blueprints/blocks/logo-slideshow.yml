name: Logo Slideshow
icon: image

fields:
  slides:
    type: structure
    label: Logos
    fields:
      logo:
        type: files
        label: Logo (Image or SVG)
        max: 1
        width: 1/2
      alt:
        type: text
        label: Alt Text
        width: 1/2

  aspect_ratio:
    type: select
    label: Logo Aspect Ratio
    default: "3/2"
    width: 1/2
    options:
      "1/1": Square (1:1)
      "3/2": Landscape (3:2)
      "4/3": Landscape (4:3)
      "16/9": Wide (16:9)
      "2/1": Ultra-wide (2:1)
      "3/1": Banner (3:1)

  per_page:
    type: number
    label: Logos per row (desktop)
    default: 4
    min: 2
    max: 8
    width: 1/2
