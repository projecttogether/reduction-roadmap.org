name: Hero
icon: star

preview: fields

tabs:
  content:
    fields:
      layout:
        type: select
        label: Layout
        options:
          equal: "1/2 – 1/2"
          text-wide: "2/3 – 1/3"
        default: equal
        width: 1/2
      headlineSize:
        type: select
        label: Headline size
        options:
          hero: Hero
          fluid-3rem: Fluid (max. 3rem)
          xl: Extra large
          lg: Large
          md: Medium
          sm: Small
        default: hero
        width: 1/2
      headline:
        type: text
        label: Headline
        width: 1/1
        help: Leave empty to use the page title.
      text:
        type: textarea
        label: Text
        buttons: false
        width: 1/1
      image:
        type: files
        label: Image
        max: 1
        width: 1/2
      alt:
        type: text
        label: Image alt text
        width: 1/2

  layout: blocks/layout-settings
