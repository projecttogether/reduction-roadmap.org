name: Praxisbeispiel-Einreichungsformular
icon: inbox

tabs:
  content:
    fields:
      parent:
        type: pages
        label: Übergeordnete Best-Practices-Seite
        query: site.find('best-practices')
        max: 1
        help: Eingereichte Projekte werden als Entwürfe unter dieser Seite abgelegt.
        width: 1/2

      triggerLabel:
        type: text
        label: Beschriftung des Start-Buttons
        default: Neues Projekt einreichen
        width: 1/2

      intro:
        type: textarea
        label: Einleitungstext
        buttons: false
        help: Optional.
        width: 1/1

      submitLabel:
        type: text
        label: Beschriftung des Absenden-Buttons
        default: Projekt einreichen
        width: 1/2

  layout: blocks/layout-settings
