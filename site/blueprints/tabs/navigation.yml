label: Navigation
icon: menu
sections:
  navigation:
    type: fields
    fields:
      navigation:
        type: structure
        label: Navigation Links
        help: Add, remove, and reorder the links shown in the header navigation.
        fields:
          label:
            type: text
            label: Label
            width: 1/2
            required: true
          link:
            type: link
            label: Page
            width: 1/2
            max: 1
            image: icon
          footer:
            type: toggle
            label: Link to footer
            text:
              - No
              - Yes
            default: false
            width: 1/2
          is_cta:
            type: toggle
            label: Call to Action
            width: 1/2
            default: false
            help:
              en: Link will be highlighted as a call to action in the navigation.
              de: Link wird als Call to Action in der Navigation hervorgehoben.
      footerNavigation:
        type: structure
        label: Footer Links
        help: Legacy flat footer links. Use Footer sections for the grouped footer navigation.
        fields:
          label:
            type: text
            label: Label
            width: 1/2
            required: true
          link:
            type: pages
            label: Page
            width: 1/2
            max: 1
            image: icon
      footerSections:
        type: structure
        label: Footer sections
        help: Grouped link sections shown in the dark-green footer.
        fields:
          title:
            type: text
            label: Section title
            required: true
          links:
            type: structure
            label: Links
            fields:
              label:
                type: text
                label: Label
                required: true
                width: 1/2
              link:
                type: link
                label: Link
                required: true
                width: 1/2
      footerInfo:
        type: textarea
        label: Footer info text
        buttons: false
        help: Optional text shown below the footer logo.