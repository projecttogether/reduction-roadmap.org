title: Site

tabs:
  pages:
    label: Pages
    icon: page
    sections:
      pages:
        type: pages
        headline: All Pages
        layout: list
        image: icon

  navigation:
    label: Navigation
    icon: menu
    sections:
      navigation:
        type: fields
        fields:
          navigation:
            type: structure
            label: Navigation Links
            help: Add, remove, and reorder the links shown in the header navigation.
            fields:
              label:
                type: text
                label: Label
                width: 1/2
                required: true
              link:
                type: pages
                label: Page
                width: 1/2
                max: 1
                image: icon
          footerNavigation:
            type: structure
            label: Footer Links
            help: Links shown in the footer. Falls back to About, Contact and Privacy if empty.
            fields:
              label:
                type: text
                label: Label
                width: 1/2
                required: true
              link:
                type: pages
                label: Page
                width: 1/2
                max: 1
                image: icon

  branding:
    label: Branding & Social
    icon: image
    sections:
      branding:
        type: fields
        fields:
          logo:
            type: files
            label: Logo
            help: Upload the site logo (PNG/SVG)
            max: 1
          socialLinkedin:
            type: url
            label: LinkedIn URL
          socialInstagram:
            type: url
            label: Instagram URL